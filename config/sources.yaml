# ───────── 수집 대상 ─────────
# enabled: false 로 끄고 켤 수 있습니다.

sources:

  # ═══ 영역 1. 나라장터 (영상제작 '용역') ═══
  # 공공데이터포털에서 아래 3개 API를 활용신청 → 인증키를 G2B_SERVICE_KEY 에 설정
  - id: g2b_plan
    type: g2b
    name: 나라장터 발주계획
    stage: plan          # 발주계획
    lookback_days: 30    # 발주계획은 연초에 몰려 올라와서 넉넉히 조회
    inqry_divs: [1, 2]   # 조회 기준: 1(등록일)로 0건이면 2로 다시 시도

  - id: g2b_prespec
    type: g2b
    name: 나라장터 사전규격
    stage: prespec       # 사전규격
    lookback_days: 3

  - id: g2b_bid
    type: g2b
    name: 나라장터 입찰공고
    stage: bid           # 입찰공고
    lookback_days: 3
    attachments: true    # 영상 관련 공고만 첨부파일(공고서·제안요청서 등)을 추가로 받음
    rows: 100            # 02 버전은 한 번에 받을 수 있는 범위가 좁음 ('입력범위값 초과' 방지)
    chunk_days: 1

  # ═══ 기관별 입찰공고 API (입찰공고 탭에 함께 표시) ═══
  # 공공데이터포털 활용신청 화면의 End Point 뒤에 '/기능이름'을 붙여 url 에 넣으면 된다. 키는 나라장터와 같은 것.
  # 예)
  # - id: kwater_bid
  #   type: datagokr
  #   name: 수자원공사
  #   category: 입찰공고
  #   url: https://apis.data.go.kr/(End Point)/(기능이름)

  - id: nuri_bid
    type: g2b
    stage: bid
    name: 누리장터
    category: 입찰공고
    base_url: https://apis.data.go.kr/1230000/ao/PrvtBidNtceService    # 누리장터 민간입찰공고
    operation: getPrvtBidPblancListInfoServc                             # 용역조회
    lookback_days: 3
    rows: 100
    chunk_days: 1

  - id: kra_bid
    type: datagokr
    name: 한국마사회
    category: 입찰공고
    url: https://apis.data.go.kr/B551015/API182/E-noticeInfo      # 전자입찰 공고정보
    key_param: ServiceKey     # 마사회는 인증키 항목 이름이 대문자로 시작
    month_param: notice_month # 공고월(YYYYMM)로 조회
    lookback_days: 14
    params: {numOfRows: 30}   # 한 번에 적게 요청해 서버 부담(시간 초과)을 줄임

  - id: kwater_bid
    type: datagokr
    name: 수자원공사
    category: 입찰공고
    url: https://apis.data.go.kr/B500001/ebid/tndr3/servcList     # 용역 입찰공고 (영상제작은 용역)
    month_param: searchDt     # 검색년월(YYYYMM) 필수
    lookback_days: 14

  - id: kepco_bid
    type: kepco
    name: 한국전력
    category: 입찰공고
    lookback_days: 14     # 한전과 발전 자회사 전체 (KEPCO_API_KEY 필요)

  # ═══ 학교장터 (학교·교육청 소액 견적요청) — 키 필요 없음 ═══
  - id: s2b
    type: s2b
    name: 학교장터
    category: 학교장터
    item: 용역
    lookback_days: 7
    queries: [영상, 촬영, 유튜브, 숏폼, 다큐, 애니메이션, 뮤직비디오]
    # 견적제출이 '전체공개'이거나 참가가능지역에 아래 지역이 있을 때만 표시 ('공급업체 지정'은 제외)
    allowed_regions: [서울, 인천, 경기]

  # ═══ 방송사 공모 (외주제작·기획안 공모, 방송 제작지원 사업) ═══
  # 방송사 게시판을 직접 보는 소스는 아래 'type: board' 항목들. 뉴스는 놓친 공모를 보완.
  - id: gnews_broadcast
    enabled: false        # 뉴스는 '공모가 있었다'는 보도라 실제 공고가 아님 → 사용 안 함
    type: gnews
    name: 뉴스(방송사 공모)
    category: 방송사 공모
    lookback_days: 21
    queries:
      - 외주제작 공모
      - 제작 기획안 공모 방송
      - 방송 외주제작사 모집
      - 방송콘텐츠 제작지원 공모
    keywords: [외주, 기획안, 제작지원, 제작 지원, 제작사, 프로그램 공모, 콘텐츠 공모]
    exclude: [시상식, 시상, 성료, 수상작, 수상, 마무리, 선정 결과, 성황, 포토, 발표, 극본, 시나리오 공모전, 채용]

  # ── 방송사·기관 공모 게시판 (GitHub 서버에서 접속·인식 확인 완료) ──
  - id: mbc_oiju
    detail_deadline: true      # 본문에서 접수 마감일 읽기
    type: board
    name: MBC 콘텐츠협력센터
    category: 방송사 공모
    url: https://oiju.imbc.com/
    filter: all
    exclude: [결과, 합격, 선정]
    allow_empty: true
  - id: ebs_announce
    detail_deadline: true      # 본문에서 접수 마감일 읽기
    type: board
    name: EBS 공고
    category: 방송사 공모
    # 공고 목록 페이지는 자바스크립트로 그려져서, 최신 공고가 보이는 EBS 소개 첫 화면에서 공고만 수집
    url: https://about.ebs.co.kr/kor/main/index
    url_contains: /notice/announce
    filter: all
    keywords: &bc_kw [외주, 기획안, 제작사, 제작업체, 제작 업체, 콘텐츠 제작, 프로그램 공모, 프로그램 제작, 영상 제작, 영상제작, 다큐]
    exclude: &bc_ex [결과, 합격, 시청자위원, 평가위원, 모니터, 미디어렙, 채용, 개인정보, 공정성 평가, 종료, 세트]
    max_age_days: 120
    allow_empty: true
  - id: ytn_notice
    detail_deadline: true      # 본문에서 접수 마감일 읽기
    type: board
    name: YTN
    category: 방송사 공모
    url: https://www.ytn.co.kr/info/notice.php
    keywords: *bc_kw
    exclude: *bc_ex
    max_age_days: 120
    allow_empty: true
  - id: ytn_science
    detail_deadline: true      # 본문에서 접수 마감일 읽기
    type: board
    name: YTN 사이언스
    category: 방송사 공모
    url: https://m.science.ytn.co.kr/community/notice.php?s_mcd=0002
    title_strip: '\s*20\d\d-\d\d-\d\d\s*조회\s*[\d,]+\s*$'
    keywords: *bc_kw
    exclude: *bc_ex
    max_age_days: 120
    allow_empty: true
  - id: ktv_notice
    detail_deadline: true      # 본문에서 접수 마감일 읽기
    type: board
    name: KTV 국민방송
    category: 방송사 공모
    url: https://www.ktv.go.kr/board/list?board_id=35
    keywords: *bc_kw
    exclude: *bc_ex
    max_age_days: 120
    allow_empty: true
  - id: kbs_oeju
    detail_deadline: true      # 본문에서 접수 마감일 읽기
    type: board
    name: KBS 외주제작
    category: 방송사 공모
    url: https://oeju.kbs.co.kr/OejuMain.aspx
    filter: all
    exclude: [결과, 심사, 합격, 선정, 메뉴얼, 매뉴얼, 개인정보, 입고]
    max_age_days: 120
    allow_empty: true
  - id: yonhap_notice
    detail_deadline: true      # 본문에서 접수 마감일 읽기
    type: board
    name: 연합뉴스TV
    category: 방송사 공모
    url: https://www.yonhapnewstv.co.kr/notice
    keywords: *bc_kw
    exclude: *bc_ex
    max_age_days: 120
    allow_empty: true
  - id: kocca_support
    detail_deadline: true      # 본문에서 접수 마감일 읽기
    type: board
    name: 한국콘텐츠진흥원
    category: 방송사 공모
    url: https://www.kocca.kr/kocca/pims/list.do?menuNo=204104
    keywords: [방송, 영상, 드라마, 예능, 다큐, 기획안, 콘텐츠 제작, 제작 지원, 제작지원, 외주]
    exclude: *bc_ex
    max_age_days: 120
    allow_empty: true
  - id: kca_notice
    detail_deadline: true      # 본문에서 접수 마감일 읽기
    type: board
    name: 방송통신전파진흥원
    category: 방송사 공모
    url: https://www.kca.kr/boardList.do?pageId=www47&boardId=NOTICE
    keywords: [방송콘텐츠, 방송프로그램, 방송 프로그램, 제작지원, 제작 지원, 기획개발, 기획안, 외주]
    exclude: *bc_ex
    max_age_days: 120
    allow_empty: true

  # ═══ 공모전 (영상·UCC) ═══
  - id: contestkorea_video
    type: board
    name: 콘테스트코리아
    category: 공모전
    url: https://www.contestkorea.com/sub/list.php?int_gbn=1&Txt_bcode=031210001
    link_mode: true
    url_contains: "Txt_bcode=031210001&str_no="
    title_strip: '^(?:\d+\.\s*)?(?:\S+•\S+\s+)*'
    detail_deadline: true
    file_link_contains: file_dn.php
    filter: all
    exclude: [수상자, 결과, 발표, 사진공모전, 사진 공모전, 수중사진]
    allow_empty: true

  # ═══ 영역 2. 제작 의뢰·공모 (입찰 외) ═══

  # 네이버 카페·블로그·뉴스 검색 (NAVER_CLIENT_ID / NAVER_CLIENT_SECRET 필요)
  - id: naver_requests
    enabled: false        # 사용하지 않음 (사용자 요청)
    type: naver
    name: 네이버 검색
    targets: [cafe]       # 실제 의뢰 글은 주로 카페에 올라옴 (뉴스·블로그는 보도·업체 홍보가 대부분)
    lookback_days: 14
    queries:
      - 영상제작 업체 구합니다
      - 영상 제작 의뢰
      - 영상 외주 구합니다
      - 홍보영상 제작 업체 모집
      - 영상제작 업체 선정
      - 영상 촬영 업체 구함
      - 유튜브 영상 제작 업체 찾습니다
    # 업체 홍보글(“제작해드립니다”)을 거르기 위한 제외어
    exclude: [해드립니다, 해드려요, 받습니다, 포트폴리오, 후기, 저렴, 할인, 이벤트, 전문업체, 견적문의, 문의주세요, 상담]

  # 구글 뉴스 RSS (키 필요 없음) — 기관의 영상제작 공모·업체 모집 소식
  - id: gnews_requests
    enabled: false        # 뉴스 기사는 실제 공모 공고가 아니라서 사용 안 함
    type: gnews
    name: 뉴스
    lookback_days: 14
    queries:
      - 영상제작 업체 모집
      - 영상 공모전
      - 홍보영상 제작 공모
    # 이미 끝난 공모의 결과 기사는 제외
    exclude: [시상식, 시상, 성료, 수상작, 수상, 마무리, 선정 결과, 성황, 포토, 발표]

  # 특정 게시판을 직접 수집하는 예시 (URL 확인 후 enabled: true)
  #   먼저 `python -m monitor probe <게시판URL>` 로 제대로 인식되는지 확인하세요.
  - id: example_board
    enabled: false
    type: board
    name: 예시 기관 견적공고
    url: https://example.org/board/list
    filter: keywords      # 영상 관련 글만 (영상 전용 게시판이면 all)
