# ───────── 영상제작 공고 모니터 설정 ─────────

# 제목에 아래 단어 중 하나라도 있으면 수집 (띄어쓰기·대소문자 무시)
keywords:
  - 영상
  - 동영상
  - 촬영
  - 다큐
  - 유튜브
  - 숏폼
  - 쇼츠
  - 홍보물 제작
  - 콘텐츠 제작
  - 컨텐츠 제작
  - 애니메이션
  - 모션그래픽
  - 뮤직비디오
  - 광고 제작
  - 방송 제작
  - 프로그램 제작
  - 생중계
  - 중계방송
  - 온라인 중계
  - 행사 중계
  - 라이브커머스
  - 뉴미디어

# 제목에 아래 표현이 있으면 '제외 키워드'가 같이 있어도 남김
#   예) "조명 장비 대여 및 영상 제작" → 장비가 있어도 영상제작이 포함되어 있으므로 표시
strong_keywords:
  - 영상제작
  - 영상촬영
  - 홍보영상
  - 동영상 제작
  - 촬영 및 편집
  - 영상 편집
  - 졸업영상
  - 다큐멘터리

# 제목에 아래 단어가 있으면 '영상제작' 표현이 같이 있어도 무조건 제외
hard_exclude_keywords:
  # ── 컴퓨터 프로그램(소프트웨어) 개발 — '프로그램 제작'과 혼동 방지 ──
  - 운영 프로그램
  - 통합운영
  - 소프트웨어
  - 전산
  - 배전계통
  - CCTV
  - 폐쇄회로
  - 영상정보처리
  - 촬영장비
  - 시스템
  - 단층촬영
  - 위성영상
  - 하수관
  - 웹사이트
  - 인쇄

# 제목에 아래 단어가 있으면 제외 ('영상'이 들어가지만 영상제작과 무관한 것)
exclude_keywords:
  - CCTV
  - 폐쇄회로
  - 영상감시
  - 영상정보처리
  - 영상분석
  - 영상판독
  - 판독
  - 영상검사
  - 설비
  - 의료영상
  - 영상의학
  - 영상회의
  - 화상회의
  - 영상장치
  # ── 장비 판매·설치·유지보수 (영상제작 아님) ──
  - 장비
  - 구매
  - 구입
  - 납품
  - 설치
  - 교체
  - 수리
  - 임차
  - 임대
  - 대여
  - 부스
  - 렌탈
  # ── 학교 이름에 '영상'이 들어가 잘못 걸리는 공고 (예: OO영상고 냉난방기 세척) ──
  - 세척
  - 청소
  - 냉난방
  - 방역
  - 급식
  - 시스템 구축
  - 전광판
  - 디스플레이
  - LED
  - 송출시스템
  - 영상인식
  - 영상관제
  - 영상보안
  - 지능형
  - 블랙박스

# 대시보드에서 별색으로 강조할 공고 (제목 기준, 띄어쓰기 무시)
highlight_keywords:
  - 홍보영상
  - 홍보동영상

# 대시보드에 보여줄 기간(일) / DB 보관 기간(일)
dashboard_days: 90
keep_days: 365

db_path: data/notices.db
site_dir: docs

# 알림 메시지에 넣을 대시보드 주소 (GitHub Pages 주소). 환경변수 DASHBOARD_URL 로도 지정 가능
dashboard_url: ""

notify:
  only_matched: false

# 제안요청서 AI 분석 (ANTHROPIC_API_KEY 필요)
#   첨부서류(HWP/PDF)를 읽고 배점표(정량·정성), 실적 평가기준, 용역기간, 참가자격, 일정, 과업내용을 정리
analysis:
  enabled: true
  model: claude-opus-5-5
  effort: medium
  stages: [입찰공고, 사전규격]
  max_per_run: 10      # 한 번 실행에 분석할 최대 공고 수 (비용 관리)
  max_files: 6         # 공고당 읽을 최대 첨부파일 수
  lookback_days: 14    # 최근 며칠 내 수집된 공고만 분석
